name: tdl-console-test

x-api-env: &api-env
  APP_ENV: production
  DATA_DIR: /data
  DATABASE_URL: sqlite:////data/test.sqlite3
  REDIS_URL: redis://redis:6379/1
  TDL_BINARY: /app/scripts/fake-tdl.sh
  AUTHENTIK_ISSUER: http://oidc:9000/application/o/tdl-console/
  AUTHENTIK_AUDIENCE: tdl-console
  AUTHENTIK_JWKS_URL: http://oidc:9000/application/o/tdl-console/jwks/
  AUTHENTIK_ADMIN_GROUP: tdl-admin
  TRUSTED_HOSTS: api,localhost,127.0.0.1

services:
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 20
  oidc:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
      target: tests
    command: [uvicorn, mock_oidc:app, --app-dir, /app/scripts, --host, 0.0.0.0, --port, '9000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
      target: tests
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --workers, '1']
    environment: *api-env
    volumes: [test-data:/data]
    depends_on:
      redis: {condition: service_healthy}
      oidc: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
      target: tests
    command: [python, -m, app.rq_worker]
    environment: *api-env
    volumes: [test-data:/data]
    depends_on:
      api: {condition: service_healthy}
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      target: runtime
    environment:
      AUTH_SECRET: playwright-test-secret-at-least-32-characters
      AUTH_URL: http://web:3000
      AUTHENTIK_ISSUER: http://oidc:9000/application/o/tdl-console/
      AUTHENTIK_CLIENT_ID: tdl-console
      AUTHENTIK_CLIENT_SECRET: test-client-secret
      AUTHENTIK_ADMIN_GROUP: tdl-admin
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      interval: 3s
      start_period: 10s
      retries: 30
  backend-tests:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
      target: tests
    profiles: [checks]
  frontend-tests:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      target: tests
    profiles: [checks]
  playwright:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.playwright
    profiles: [checks]
    environment:
      PLAYWRIGHT_BASE_URL: http://web:3000
      E2E_INTEGRATION: '1'
    volumes:
      - ../../docs/design-audit:/app/docs/design-audit
    depends_on:
      web: {condition: service_healthy}
      worker: {condition: service_started}

volumes:
  test-data:
